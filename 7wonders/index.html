<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>🏛️ 7 Wonders</title>
<style>
:root {
  --bg-0: #0c1210;
  --bg-1: #152420;
  --bg-2: #1d332c;
  --bg-3: #2a4a3f;
  --accent: #f0c674;
  --text: #e8f0ea;
  --text-dim: #9fc4ac;
  --border: #3d6656;
  --danger: #e0555e;
  --good: #7ec98f;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  background: var(--bg-0);
  color: var(--text);
  font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
  overscroll-behavior: none;
  touch-action: manipulation;
}
#app {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  padding: 10px;
  max-width: 900px;
  margin: 0 auto;
  gap: 12px;
}

/* ---- status bar ---- */
.status-bar {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 16px;
  flex-wrap: wrap;
  gap: 8px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
}
.status-bar h1 {
  font-size: 1.15rem;
  margin: 0;
  color: var(--accent);
  white-space: nowrap;
}
.status-chips {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 4px 10px;
  font-size: 0.85rem;
  color: var(--text-dim);
}
.chip strong { color: var(--text); font-weight: 600; }

/* ---- hand prompt ---- */
.hand-prompt {
  font-size: 0.9rem;
  color: var(--text-dim);
  padding: 0 4px;
}
.hand-prompt strong { color: var(--text); }

/* ---- hand ---- */
/* A responsive grid (not a single scrolling row) so the whole hand is visible via normal
   vertical scrolling — on a ~360px phone that's a legible 3-up grid instead of swiping through
   cards one at a time. */
.hand {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(104px, 1fr));
  gap: 8px;
  padding: 2px 2px 4px;
}
.card {
  background: var(--bg-1);
  border: 2px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font-family: inherit;
  padding: 0;
  display: flex;
  flex-direction: column;
  transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  transform: translateY(0);
}
.card:hover { border-color: var(--accent); transform: translateY(-4px); }
.card:focus-visible {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(240, 198, 116, 0.35);
}
.card[aria-selected="true"] {
  border-color: var(--accent);
  transform: translateY(-4px) scale(1.02);
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45), 0 0 0 2px var(--accent);
}
.card.unaffordable { opacity: 0.65; }

/* Grid tiles are art-forward: a thin name bar, then a large image with a handful of small
   glanceable badges. Full detail (cost breakdown, effect text, chain info) lives in the action
   bar once a card is selected — see .selected-detail below — rather than crammed onto every
   tile in the hand at once. */
.card-name-bar {
  padding: 5px 6px 4px;
  text-align: center;
  font-size: 0.78rem;
  font-weight: 700;
  line-height: 1.15;
}
.card-art {
  position: relative;
  aspect-ratio: 0.82;
  background-size: cover;
  background-position: center;
  border-top: 1px solid var(--border);
}
.card-emoji-badge {
  position: absolute; top: 6px; right: 6px;
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(12, 18, 16, 0.75);
  border: 1px solid rgba(255, 255, 255, 0.25);
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem; line-height: 1;
}
.card-lock-badge {
  position: absolute; top: 6px; left: 6px;
  width: 24px; height: 24px; border-radius: 50%;
  background: rgba(12, 18, 16, 0.75);
  border: 1px solid rgba(224, 85, 94, 0.6);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.78rem; line-height: 1;
}
.card-cost-pill, .card-value-badge {
  position: absolute; bottom: 6px;
  background: rgba(12, 18, 16, 0.8);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 999px;
  padding: 3px 7px;
  font-size: 0.72rem;
  font-weight: 700;
  display: flex; align-items: center; gap: 3px;
  line-height: 1;
}
.card-cost-pill { left: 6px; }
.card-value-badge { right: 6px; color: var(--accent); }

/* ---- selected-card detail (inside the action bar) ---- */
.selected-detail { display: flex; flex-direction: column; gap: 6px; }
.selected-detail .selected-title {
  display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap;
}
.selected-detail .selected-title strong { font-size: 0.95rem; color: var(--accent); }
.selected-detail .selected-title .selected-type {
  font-size: 0.68rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.03em;
}
.card-row {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
  font-size: 0.78rem;
}
.card-row .label { color: var(--text-dim); font-size: 0.68rem; }
.icon-badge {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  background: var(--bg-3);
  border-radius: 5px;
  padding: 2px 5px;
  font-size: 0.78rem;
}
.lock-badge { margin-left: auto; font-size: 0.85rem; }
.card-effect {
  font-size: 0.72rem;
  color: var(--text-dim);
  line-height: 1.35;
  font-style: italic;
}
.card-chain {
  font-size: 0.68rem;
  color: var(--good);
  line-height: 1.35;
}

/* ---- rivals strip ---- */
.rivals-strip {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 2px 2px 6px;
}
.rival-chip {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 6px 10px;
  font-size: 0.78rem;
  color: var(--text-dim);
  white-space: nowrap;
}
.rival-chip.neighbor { border-color: var(--accent); color: var(--text); }
.rival-chip .rival-emoji { font-size: 1.3rem; }
.rival-chip .rival-tag { font-size: 0.6rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em; }

/* ---- power / bonus action row ---- */
.power-row { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 2px; }
.power-btn {
  background: var(--bg-2);
  border-color: var(--good);
  color: var(--good);
  font-size: 0.8rem;
  padding: 7px 12px;
}
.power-btn:hover:not(:disabled) { background: var(--bg-3); }

/* ---- action panel (bottom sticky bar) ---- */
.action-bar {
  position: sticky;
  bottom: 0;
  z-index: 5;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.35);
}
.action-bar .selected-label { font-size: 0.85rem; color: var(--text-dim); }
.action-bar .selected-label strong { color: var(--accent); }
.action-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
.action-btn {
  flex: 1 1 140px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 8px 10px;
}
.action-btn .action-title { font-size: 0.88rem; font-weight: 700; }
.action-btn .action-sub { font-size: 0.68rem; font-weight: 400; opacity: 0.85; }
.action-btn.build { border-color: var(--good); }
.action-btn.build:not(:disabled) { color: var(--good); }
.action-btn.wonder { border-color: var(--accent); }
.action-btn.wonder:not(:disabled) { color: var(--accent); }
.action-btn.discard { border-color: var(--danger); }
.action-btn.discard:not(:disabled) { color: var(--danger); }

/* ---- city panel ---- */
.city-toggle { font-size: 0.78rem; padding: 5px 10px; }
.city-panel {
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.city-panel h3 { margin: 0; font-size: 0.85rem; color: var(--accent); }
.city-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.city-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--bg-2);
  border-radius: 6px;
  padding: 3px 7px;
  font-size: 0.76rem;
}
.wonder-progress { display: flex; gap: 4px; align-items: center; font-size: 0.8rem; }
.wonder-stage-dot {
  width: 14px; height: 14px; border-radius: 4px;
  background: var(--bg-3); border: 1px solid var(--border);
}
.wonder-stage-dot.built { background: var(--accent); border-color: var(--accent); }

/* ---- modal (discard-pile picker) ---- */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(5, 8, 6, 0.75);
  display: flex; align-items: center; justify-content: center;
  z-index: 20; padding: 16px;
}
.modal-panel {
  background: var(--bg-1);
  border: 1px solid var(--accent);
  border-radius: 12px;
  padding: 16px;
  max-width: 480px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
}
.modal-panel h3 { margin: 0 0 10px; color: var(--accent); }
.discard-pile-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.discard-card-btn {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 8px; font-size: 0.75rem; text-align: center;
}
.discard-card-btn .discard-emoji { font-size: 1.6rem; }

/* ---- setup screen ---- */
.setup-panel {
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.setup-panel h2 { margin: 0; color: var(--accent); font-size: 1rem; }
.count-row { display: flex; gap: 10px; }
.count-btn { flex: 1; }
.count-btn.selected { background: var(--accent); border-color: var(--accent); color: #17140b; }
.wonder-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.wonder-card {
  background: var(--bg-2);
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  color: var(--text);
  font-family: inherit;
  text-align: center;
}
.wonder-card:hover { border-color: var(--accent); }
.wonder-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.wonder-card .wonder-emoji { font-size: 2rem; }
.wonder-card .wonder-name { font-size: 0.85rem; font-weight: 700; }
.wonder-card .wonder-resource { font-size: 0.7rem; color: var(--text-dim); }

/* ---- age-end / game-end screens ---- */
.ageend-panel, .gameend-panel {
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.ageend-panel h2, .gameend-panel h2 { margin: 0; color: var(--accent); text-align: center; }
.ageend-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--bg-2); border-radius: 8px; padding: 8px 12px; font-size: 0.85rem;
}
.ageend-row.self { border: 1px solid var(--accent); }
.token-badges { display: flex; gap: 4px; }
.token-badge {
  font-size: 0.72rem; font-weight: 700; padding: 2px 6px; border-radius: 999px;
}
.token-badge.pos { background: rgba(126, 201, 143, 0.2); color: var(--good); }
.token-badge.neg { background: rgba(224, 85, 94, 0.2); color: var(--danger); }

.score-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
.score-table th, .score-table td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--border); }
.score-table th:first-child, .score-table td:first-child { text-align: left; }
.score-table thead th { color: var(--text-dim); font-weight: 600; font-size: 0.7rem; text-transform: uppercase; }
.score-table tbody tr.winner { background: rgba(240, 198, 116, 0.12); }
.score-table tbody tr.winner td:first-child { color: var(--accent); font-weight: 700; }
.score-table td.total-col { font-weight: 700; color: var(--text); }
.score-scroll { overflow-x: auto; }
.winner-banner {
  text-align: center; font-size: 1.1rem; font-weight: 700; color: var(--accent);
  padding: 6px 0;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: 2px solid var(--border);
  background: var(--bg-2);
  color: var(--text);
  border-radius: 8px;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 600;
  transition: background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
}
button:hover:not(:disabled) { background: var(--bg-3); border-color: var(--accent); }
button:disabled { opacity: 0.4; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: #17140b; }
button.primary:hover:not(:disabled) { filter: brightness(1.08); }

/* Below ~330px the 3-up grid can't fit at a legible width, so it falls back to 2 columns
   (auto-fit does this automatically) — take advantage of the extra room per card. */
@media (max-width: 330px) {
  .card-emoji { font-size: 2.2rem; }
  .card-name { font-size: 0.95rem; }
  .card-type-label { font-size: 0.66rem; }
  .card-row, .icon-badge { font-size: 0.82rem; }
  .card-row .label { font-size: 0.7rem; }
  .card-effect { font-size: 0.74rem; }
  .card-chain { font-size: 0.68rem; }
  .status-bar h1 { font-size: 1rem; }
}
</style>
</head>
<body>
<div id="app"></div>
<script src="game-data.js"></script>
<script src="engine.js"></script>
<script src="script.js"></script>
</body>
</html>
