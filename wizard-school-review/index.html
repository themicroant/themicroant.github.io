<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Card Text Review</title>
<style>
:root{--bg:#f6f3ec;--fg:#241f1a;--mute:#756c60;--card:#fff;--line:#ddd5c6;--acc:#5b3fa0;--up:#2f7d4f;--down:#b3392f}
@media(prefers-color-scheme:dark){:root{--bg:#17141c;--fg:#ece6f4;--mute:#9a91a8;--card:#221e2b;--line:#352f42;--acc:#a78bfa;--up:#5fc88a;--down:#f0786c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;z-index:2}
h1{font-size:18px;margin:0 0 6px}.stat{color:var(--mute);font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
button,select{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 10px;cursor:pointer}
button.on{border-color:var(--acc);outline:2px solid var(--acc)}
main{max-width:720px;margin:0 auto;padding:12px 16px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.card.u{border-left:5px solid var(--up)}.card.d{border-left:5px solid var(--down)}
.meta{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.name{font-weight:600;margin:2px 0}.text{margin:4px 0 10px;font-family:Georgia,serif;font-size:17px}
.vote{display:flex;gap:8px;align-items:center}.vote button{font-size:18px;min-width:52px}
.vote .up.on{background:var(--up);color:#fff;border-color:var(--up);outline:0}.vote .down.on{background:var(--down);color:#fff;border-color:var(--down);outline:0}
.note{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;background:var(--bg);color:var(--fg)}
dialog{max-width:640px;width:calc(100% - 32px);background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px}
textarea{width:100%;height:50vh;font:13px/1.4 ui-monospace,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px}
.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
</style></head><body>
<header><h1>Card text review</h1><div class="stat" id="stat"></div>
<div class="bar"><select id="grp"></select><button id="unr">Unreviewed only</button><button id="fin" class="primary">Finish &amp; copy</button></div></header>
<main id="list"></main>
<dialog id="dlg"><p>Copy this and paste it back to Claude.</p><textarea id="out" readonly></textarea>
<div class="bar"><button id="cp" class="primary">Copy to clipboard</button><button id="cl">Close</button></div><p class="stat" id="cpmsg"></p></dialog>
<script>
const E=[{"id":"Sorting|Dove for the Falling Trunk|story","group":"Sorting","name":"Dove for the Falling Trunk","field":"story","text":"A trunk slid off the dock and you were already in the water. You can't remember deciding."},{"id":"Sorting|Corrected the Prefect|story","group":"Sorting","name":"Corrected the Prefect","field":"story","text":"You told a sixth-year the real rule about the stairs. You were right. It did not help."},{"id":"Sorting|Stepped on the Third Step|story","group":"Sorting","name":"Stepped on the Third Step","field":"story","text":"Everyone said it bites. You stepped on it twice, to be sure."},{"id":"Sorting|Traded Sweets for Secrets|story","group":"Sorting","name":"Traded Sweets for Secrets","field":"story","text":"By the time the boats landed you knew three scandals and nobody's real name."},{"id":"Sorting|Befriended the Right Cousin|story","group":"Sorting","name":"Befriended the Right Cousin","field":"story","text":"She is related to someone important. You have no idea who. You sat beside her anyway."},{"id":"Sorting|Slipped the Queue|story","group":"Sorting","name":"Slipped the Queue","field":"story","text":"You were at the front before anyone saw you leave the back."},{"id":"Sorting|Solved the Door Riddle|story","group":"Sorting","name":"Solved the Door Riddle","field":"story","text":"The door asked what you could break by naming it. You said 'silence' and walked right in."},{"id":"Sorting|Read the Whole Welcome Letter|story","group":"Sorting","name":"Read the Whole Welcome Letter","field":"story","text":"Page four had a map, page six a warning. You photographed both with your memory."},{"id":"Sorting|Counted the Staircases|story","group":"Sorting","name":"Counted the Staircases","field":"story","text":"Forty-one, on the first pass. Forty-three on the second. You wrote that down."},{"id":"Sorting|Shared Your Last Pasty|story","group":"Sorting","name":"Shared Your Last Pasty","field":"story","text":"He had been staring at it since the train. You split it and learned his whole life story."},{"id":"Sorting|Waited for the Slowest First-Year|story","group":"Sorting","name":"Waited for the Slowest First-Year","field":"story","text":"Everyone else ran ahead. You stayed, and the stairs behaved for both of you."},{"id":"Sorting|Kept a Stranger's Secret|story","group":"Sorting","name":"Kept a Stranger's Secret","field":"story","text":"She told you something awful in the boat. You still haven't told a soul."},{"id":"Sorting|Shook Hands with the Giant|story","group":"Sorting","name":"Shook Hands with the Giant","field":"story","text":"The groundskeeper's hand swallowed yours to the elbow. You shook it firmly, the way your gran taught you."},{"id":"Sorting|Fished a Stranger's Toad from the Lake|story","group":"Sorting","name":"Fished a Stranger's Toad from the Lake","field":"story","text":"It wasn't your toad. You went in after it anyway, and it has refused to leave your pocket ever since."},{"id":"Sorting|Asked the Hat How It Was Doing|story","group":"Sorting","name":"Asked the Hat How It Was Doing","field":"story","text":"It had been asking questions for a thousand years. Nobody had ever asked it one back. It got a little choked up."},{"id":"Sorting|Asked the Ghost How He Died|story","group":"Sorting","name":"Asked the Ghost How He Died","field":"story","text":"Everyone else was too polite. He was delighted, and the story lasted the whole of pudding."},{"id":"Sorting|Rode the Train on the Roof|story","group":"Sorting","name":"Rode the Train on the Roof","field":"story","text":"The compartment was stuffy and the view was better from up top. The guard is still looking for you."},{"id":"Sorting|Out-Stared the Castle Cat|story","group":"Sorting","name":"Out-Stared the Castle Cat","field":"story","text":"She blinked first. The whole entrance hall saw it, and she has been plotting ever since."},{"id":"Sorting|Bargained for the Window Seat|story","group":"Sorting","name":"Bargained for the Window Seat","field":"story","text":"Two liquorice wands and one very good rumour. The view across the lake was worth every bit of it."},{"id":"Sorting|Found a Shortcut on Day One|story","group":"Sorting","name":"Found a Shortcut on Day One","field":"story","text":"Behind the tapestry of the dancing trolls there is a staircase nobody uses. Now somebody does."},{"id":"Sorting|Pretended to Be a Prefect|story","group":"Sorting","name":"Pretended to Be a Prefect","field":"story","text":"For eleven glorious minutes you directed traffic in the entrance hall with a badge you'd drawn yourself."},{"id":"Sorting|Peeked at the Sorting List|story","group":"Sorting","name":"Peeked at the Sorting List","field":"story","text":"You saw the order they'd call the names. Yours wasn't on it. Someone had written it in at the bottom, in gold."},{"id":"Sorting|Charmed the Trolley Witch|story","group":"Sorting","name":"Charmed the Trolley Witch","field":"story","text":"By the end of the journey she was slipping you extra sweets and calling you 'pet'."},{"id":"Sorting|Covered for the Boy Who Was Late|story","group":"Sorting","name":"Covered for the Boy Who Was Late","field":"story","text":"You told the prefect he'd been there all along. He had, in fact, been in the lake. He has not forgotten."},{"id":"Sorting|Guessed the Hat's Song in Advance|story","group":"Sorting","name":"Guessed the Hat's Song in Advance","field":"story","text":"You wrote down your guess on the boat. You were only one rhyme off, and yours was better."},{"id":"Sorting|Translated the Grumbling Gargoyle|story","group":"Sorting","name":"Translated the Grumbling Gargoyle","field":"story","text":"It has muttered in an old dialect for centuries. It turns out to be mostly about pigeons."},{"id":"Sorting|Fixed the Train's Broken Clock|story","group":"Sorting","name":"Fixed the Train's Broken Clock","field":"story","text":"You opened it with a hairpin in the corridor. It has run five minutes fast ever since, which is how the driver likes it."},{"id":"Sorting|Argued with a Portrait and Won|story","group":"Sorting","name":"Argued with a Portrait and Won","field":"story","text":"He claimed the castle had a hundred and twelve windows. You had counted. He hasn't spoken to you since."},{"id":"Sorting|Named the Stars from the Boat|story","group":"Sorting","name":"Named the Stars from the Boat","field":"story","text":"You told the girl beside you every star's name all the way across the lake. You made half of them up. She still uses yours."},{"id":"Sorting|Found the Ghost's Spectacles|story","group":"Sorting","name":"Found the Ghost's Spectacles","field":"story","text":"They were on top of his head. You told him gently. He wept with relief, which in a ghost is mostly mist."},{"id":"Sorting|Held the Boat Steady in the Wind|story","group":"Sorting","name":"Held the Boat Steady in the Wind","field":"story","text":"Three children were seasick. You held the side the whole way across and sang to them, badly."},{"id":"Sorting|Stood Up for the Kid in Hand-Me-Downs|story","group":"Sorting","name":"Stood Up for the Kid in Hand-Me-Downs","field":"story","text":"The older boys laughed at his secondhand robes. Yours were secondhand too. You laughed back louder."},{"id":"Sorting|Shared Your Sweets with the Compartment|story","group":"Sorting","name":"Shared Your Sweets with the Compartment","field":"story","text":"Forty-two flavours, and everyone had to guess before biting. The game lasted all the way to the castle."},{"id":"Sorting|Wrote Home Before You Arrived|story","group":"Sorting","name":"Wrote Home Before You Arrived","field":"story","text":"'Dear Mum, I am on a boat. It is dark. I love you.' The owl seemed to understand completely."},{"id":"Sorting|Promised a Homesick Girl a Secret Room|story","group":"Sorting","name":"Promised a Homesick Girl a Secret Room","field":"story","text":"You told her there was a room where it was always her birthday. It turned out you were right."},{"id":"Sorting|Saved Biscuits for the Owls|story","group":"Sorting","name":"Saved Biscuits for the Owls","field":"story","text":"Every owl in the castle now knows your face, and your pockets, and exactly when you have biscuits."},{"id":"Classes T1|Levitation Basics|story","group":"Classes T1","name":"Levitation Basics","field":"story","text":"Your feather rises an inch and then your hat follows it. Pimm declares this 'an excellent start'."},{"id":"Classes T1|Cauldron Fundamentals|story","group":"Classes T1","name":"Cauldron Fundamentals","field":"story","text":"Gall's one rule: never stir widdershins. He demonstrates why with a very small explosion."},{"id":"Classes T1|Shielding Stance|story","group":"Classes T1","name":"Shielding Stance","field":"story","text":"You spend an hour learning to stand like a door. It turns out to be quite hard."},{"id":"Classes T1|Greenhouse Basics|story","group":"Classes T1","name":"Greenhouse Basics","field":"story","text":"Something in tray nine is humming along to you. Thistlewood says not to encourage it."},{"id":"Classes T1|Star Charts & Old Stories|story","group":"Classes T1","name":"Star Charts & Old Stories","field":"story","text":"Vesper's lectures are told in the dark. Half the class sleeps. The other half remembers everything."},{"id":"Items T1|Cracked Hawthorn Wand|origin","group":"Items T1","name":"Cracked Hawthorn Wand","field":"origin","text":"Belonged to an aunt who never said what she used it for. It sparks when she's mentioned."},{"id":"Items T1|Pewter Cauldron|origin","group":"Items T1","name":"Pewter Cauldron","field":"origin","text":"Dented by three generations of students. Every dent has a story. Most are about fires."},{"id":"Items T1|Unreliable Staircase Map|origin","group":"Items T1","name":"Unreliable Staircase Map","field":"origin","text":"Drawn by a first-year who vanished on stair thirty-seven. The map is right about everything but the stairs."},{"id":"Items T1|Pocket Sundial That Runs Backwards|origin","group":"Items T1","name":"Pocket Sundial That Runs Backwards","field":"origin","text":"It looks broken. Once, when you needed it most, it gave you an extra hour."},{"id":"Items T1|Tin of Self-Stirring Fudge|origin","group":"Items T1","name":"Tin of Self-Stirring Fudge","field":"origin","text":"A gift from a grandmother who insists it is just fudge. It is not just fudge."},{"id":"Friends T1|Roommate Who Talks in Spells|story","group":"Friends T1","name":"Roommate Who Talks in Spells","field":"story","text":"Her sleep-mumbled incantations have turned your socks into three kinds of fish."},{"id":"Friends T1|Cheerful Ghost of the Third Floor|story","group":"Friends T1","name":"Cheerful Ghost of the Third Floor","field":"story","text":"He died in a bake-off and has been apologising for it ever since."},{"id":"Friends T1|The Rival from the Boat|story","group":"Friends T1","name":"The Rival from the Boat","field":"story","text":"He pushed you into the lake, and you pushed him in right back. You have been inseparable since."},{"id":"Friends T1|Owl-Post Pen Pal|story","group":"Friends T1","name":"Owl-Post Pen Pal","field":"story","text":"Her letters arrive by owl and are mostly riddles. You have started answering in kind."},{"id":"Mischief T1|Midnight Kitchen Raid|story","group":"Mischief T1","name":"Midnight Kitchen Raid","field":"story","text":"The elves caught you but made you tea anyway. You were too embarrassed to say thank you."},{"id":"Mischief T1|Swapped the Hourglasses|story","group":"Mischief T1","name":"Swapped the Hourglasses","field":"story","text":"Every house points tally shifted ten minutes for a day. The prefects are still arguing."},{"id":"Mischief T1|Charmed the Portrait to Snore|story","group":"Mischief T1","name":"Charmed the Portrait to Snore","field":"story","text":"She's been asleep for three days. Nobody has dared ask how long it will last."},{"id":"Classes T1|Tidying Charms|story","group":"Classes T1","name":"Tidying Charms","field":"story","text":"Pimm snaps her fingers and the whole room tidies itself. When you snap, one sock folds itself, sulkily."},{"id":"Classes T1|Pocket Lights|story","group":"Classes T1","name":"Pocket Lights","field":"story","text":"Your first light is the size of a pea. It followed you to dinner and will not leave."},{"id":"Classes T1|Kitchen Alchemy|story","group":"Classes T1","name":"Kitchen Alchemy","field":"story","text":"Gall teaches you to brew toast that remembers being bread. It is crunchy, then wistful, then crunchy again."},{"id":"Classes T1|Colour-Change Tonics|story","group":"Classes T1","name":"Colour-Change Tonics","field":"story","text":"Your tonic should turn blue. It turns tartan. Gall, almost smiling, gives full marks for originality."},{"id":"Classes T1|Polishing the Shields|story","group":"Classes T1","name":"Polishing the Shields","field":"story","text":"Hartley has you polish shields all afternoon, round and round. You don't see the point until a hex bounces off on Thursday."},{"id":"Classes T1|Calming Small Beasts|story","group":"Classes T1","name":"Calming Small Beasts","field":"story","text":"A pixie, a jackalope and a very cross hedgehog. You calm two of them. The hedgehog calms you."},{"id":"Classes T1|Seeds & Patience|story","group":"Classes T1","name":"Seeds & Patience","field":"story","text":"Thistlewood hands everyone an acorn and says only, 'Wait.' By Friday yours has a face."},{"id":"Classes T1|Mushroom Foraging|story","group":"Classes T1","name":"Mushroom Foraging","field":"story","text":"Some mushrooms are delicious and some make you sing in Old Welsh. Thistlewood won't say which until you've tried them."},{"id":"Classes T1|Counting the Ghosts|story","group":"Classes T1","name":"Counting the Ghosts","field":"story","text":"Vesper sends you to take the ghost census. Every single ghost insists on being counted twice."},{"id":"Classes T1|Reading Old Maps|story","group":"Classes T1","name":"Reading Old Maps","field":"story","text":"Vesper's map says 'You Are Here'. It is right, and it moves when you do."},{"id":"Items T1|Carpetbag with No Bottom|origin","group":"Items T1","name":"Carpetbag with No Bottom","field":"origin","text":"Bought at a jumble sale for a penny. So far it has produced a hat stand, a lamp, and somebody's lost tortoise."},{"id":"Items T1|Dragonhide Gardening Gloves|origin","group":"Items T1","name":"Dragonhide Gardening Gloves","field":"origin","text":"Two sizes too big and still warm from whoever wore them last. They will only grip things that are alive."},{"id":"Items T1|Pre-Dented Practice Shield|origin","group":"Items T1","name":"Pre-Dented Practice Shield","field":"origin","text":"Dented for your convenience. The last owner scratched 'NOT AGAIN' on the inside."},{"id":"Items T1|Jar of Fireflies That Spell|origin","group":"Items T1","name":"Jar of Fireflies That Spell","field":"origin","text":"They spell out short words when they are happy. Mostly they spell 'SNACK'."},{"id":"Items T1|Umbrella That Opens Early|origin","group":"Items T1","name":"Umbrella That Opens Early","field":"origin","text":"It pops open a full minute before the first drop. Nobody believes it until they are soaked."},{"id":"Items T1|Scarf of Every Grandchild|origin","group":"Items T1","name":"Scarf of Every Grandchild","field":"origin","text":"Twelve feet long, one stripe per grandchild, and yours is the newest. It has kept someone warm through worse than this."},{"id":"Items T1|Pocket Toad Named Admiral|origin","group":"Items T1","name":"Pocket Toad Named Admiral","field":"origin","text":"He croaks once for yes, twice for no, and three times when you have added too much newt."},{"id":"Items T1|Snow Globe of the Castle|origin","group":"Items T1","name":"Snow Globe of the Castle","field":"origin","text":"Shake it and the tiny castle gets snow. Shake it twice and so does the real one."},{"id":"Items T1|Wand That Prefers the Other Hand|origin","group":"Items T1","name":"Wand That Prefers the Other Hand","field":"origin","text":"It works perfectly, provided you hold it in the other hand. Which hand that is changes daily."},{"id":"Items T1|The Golden Wrapper|origin","group":"Items T1","name":"The Golden Wrapper","field":"origin","text":"Found inside the last bar at the sweet shop. The fine print invites you somewhere, at a time that hasn't happened yet."},{"id":"Friends T1|Boy with a Trunk Full of Sandwiches|story","group":"Friends T1","name":"Boy with a Trunk Full of Sandwiches","field":"story","text":"His trunk holds one robe and forty sandwiches. He shares every one, and has been the most popular boy in school since Tuesday."},{"id":"Friends T1|Girl Practising Her Villain Laugh|story","group":"Friends T1","name":"Girl Practising Her Villain Laugh","field":"story","text":"She hasn't decided what she'll be evil about yet. The laugh, though, is ready."},{"id":"Friends T1|The Kitchen Cat Who Judges Everyone|story","group":"Friends T1","name":"The Kitchen Cat Who Judges Everyone","field":"story","text":"She stares at you over the soup until you confess something. So far you have confessed nine things."},{"id":"Friends T1|Small Boy with a Very Big Sword|story","group":"Friends T1","name":"Small Boy with a Very Big Sword","field":"story","text":"He borrowed it from the trophy cabinet. He can't lift it yet. He drags it to breakfast anyway, sparking all the way."},{"id":"Friends T1|Twins Who Swap Places|story","group":"Friends T1","name":"Twins Who Swap Places","field":"story","text":"Nobody, not even their mother, knows which is which. On Thursdays, neither do they."},{"id":"Friends T1|Girl Who Corrects the Textbooks|story","group":"Friends T1","name":"Girl Who Corrects the Textbooks","field":"story","text":"She writes 'citation needed' in the margins. Twice now, the textbook has written back."},{"id":"Friends T1|Boy Who Talks to Owls|story","group":"Friends T1","name":"Boy Who Talks to Owls","field":"story","text":"The owls tell him everything. He tells you most of it, in an extremely good owl voice."},{"id":"Friends T1|First-Year from Last Year|story","group":"Friends T1","name":"First-Year from Last Year","field":"story","text":"She started last September and simply never found her way out of the east wing. She's very cheerful about it."},{"id":"Mischief T1|Booby-Trapped the Common Room Door|story","group":"Mischief T1","name":"Booby-Trapped the Common Room Door","field":"story","text":"A bucket, a feather, a paint pot and a bag of marbles. The prefect who opened it called it 'honestly quite impressive'."},{"id":"Mischief T1|Fed the Fuzzy Thing After Midnight|story","group":"Mischief T1","name":"Fed the Fuzzy Thing After Midnight","field":"story","text":"The note said never after midnight. It was 12:01. You now share a dormitory with eleven of them."},{"id":"Mischief T1|Taught the Choir a Cheeky Round|story","group":"Mischief T1","name":"Taught the Choir a Cheeky Round","field":"story","text":"Each part on its own was perfectly polite. Sung all together, at the Welcome Feast, it was not."},{"id":"Mischief T1|Smuggled a Puppy into the Dormitory|story","group":"Mischief T1","name":"Smuggled a Puppy into the Dormitory","field":"story","text":"You named him Professor. He has been to three classes and done better than you in two of them."},{"id":"Mischief T1|Taught the Suits of Armour to Tap-Dance|story","group":"Mischief T1","name":"Taught the Suits of Armour to Tap-Dance","field":"story","text":"Clank, clank, CLANK, shuffle. They still do it whenever a door slams."},{"id":"Mischief T1|Sent Every Ghost a Valentine|story","group":"Mischief T1","name":"Sent Every Ghost a Valentine","field":"story","text":"Signed 'A Secret Admirer'. The ghosts haven't stopped blushing, which on a ghost is really something."},{"id":"Classes T2|Warding Charms|story","group":"Classes T2","name":"Warding Charms","field":"story","text":"Pimm lines the room with chairs and asks you to keep them from ever touching you. It takes all afternoon."},{"id":"Classes T2|Antidotes & Draughts|story","group":"Classes T2","name":"Antidotes & Draughts","field":"story","text":"Gall poisons a goldfish to demonstrate the stakes. The goldfish survives. You are not sure about Gall."},{"id":"Classes T2|Hexes & Counter-hexes|story","group":"Classes T2","name":"Hexes & Counter-hexes","field":"story","text":"You learn that every hex has a sibling that undoes it. You also learn that siblings fight."},{"id":"Classes T2|Moonbloom Cultivation|story","group":"Classes T2","name":"Moonbloom Cultivation","field":"story","text":"The blooms only open at midnight, and only if nobody is watching. You learn to be bored very quietly."},{"id":"Classes T2|Runes & Riddles|story","group":"Classes T2","name":"Runes & Riddles","field":"story","text":"A rune carved into your desk spells your name. Vesper swears she did not do it."},{"id":"Items T2|Lantern of Honest Light|origin","group":"Items T2","name":"Lantern of Honest Light","field":"origin","text":"It will not shine on anyone who is lying, which makes dinner conversation difficult."},{"id":"Items T2|Self-Updating Lesson Notes|origin","group":"Items T2","name":"Self-Updating Lesson Notes","field":"origin","text":"Found tucked into a library book. Whoever wrote them keeps adding to them."},{"id":"Items T2|Emerald Moth in a Jar|origin","group":"Items T2","name":"Emerald Moth in a Jar","field":"origin","text":"It only eats the weeds you meant to pull. You have never seen it fly."},{"id":"Items T2|Bottled Thunderclap|origin","group":"Items T2","name":"Bottled Thunderclap","field":"origin","text":"A prefect confiscated it from someone's trunk, then lost it to you. Open it only when you mean it."},{"id":"Items T2|Thread of Unbroken Luck|origin","group":"Items T2","name":"Thread of Unbroken Luck","field":"origin","text":"Tied around your wrist by a teacher who would not say who she was. It frays a little each time."},{"id":"Friends T2|Greenhouse Partner Who Never Talks|story","group":"Friends T2","name":"Greenhouse Partner Who Never Talks","field":"story","text":"She hands you the right tool before you know you need it. Her eyes say a great deal."},{"id":"Friends T2|Duelling Club Captain|story","group":"Friends T2","name":"Duelling Club Captain","field":"story","text":"He lost his first twelve matches and now teaches the thirteenth-year class."},{"id":"Friends T2|Librarian's Quiet Apprentice|story","group":"Friends T2","name":"Librarian's Quiet Apprentice","field":"story","text":"She knows where every banned book is. She will tell you only if you ask very politely."},{"id":"Friends T2|Tower-Roof Stargazer|story","group":"Friends T2","name":"Tower-Roof Stargazer","field":"story","text":"You share a blanket and a telescope. The stars are mostly an excuse to talk."},{"id":"Mischief T2|Enchanted the Snowmen to Duel|story","group":"Mischief T2","name":"Enchanted the Snowmen to Duel","field":"story","text":"By lunch there were forty of them. By dinner, only four, all in terrible shape."},{"id":"Mischief T2|Borrowed the Restricted Section Key|story","group":"Mischief T2","name":"Borrowed the Restricted Section Key","field":"story","text":"You returned it before anyone noticed. The book you took, however, still has your fingerprints on it."},{"id":"Mischief T2|Rerouted the Dinner Owls|story","group":"Mischief T2","name":"Rerouted the Dinner Owls","field":"story","text":"Four hundred letters arrived at the wrong tables. Three romances and one lawsuit followed."},{"id":"Classes T2|Animation & Its Discontents|story","group":"Classes T2","name":"Animation & Its Discontents","field":"story","text":"You charm one broom to carry water. It splits into two. Then four. Pimm arrives just before the flood, conducting."},{"id":"Classes T2|Weather in a Teacup|story","group":"Classes T2","name":"Weather in a Teacup","field":"story","text":"Your teacup rains on Tuesday and snows on Wednesday. Pimm gives you full marks and a very small umbrella."},{"id":"Classes T2|Fizzing Confections|story","group":"Classes T2","name":"Fizzing Confections","field":"story","text":"Your lemonade lifts Tobias three feet into the air. He burps his way gently back down."},{"id":"Classes T2|Shrinking Solutions|story","group":"Classes T2","name":"Shrinking Solutions","field":"story","text":"Gall shrinks a teacup, a stool and, briefly, himself. He lectures from inside a thimble without losing any dignity."},{"id":"Classes T2|Block, Parry, Duck|story","group":"Classes T2","name":"Block, Parry, Duck","field":"story","text":"Hartley throws soft things, then hard things, then soft things again exactly when you stop expecting them."},{"id":"Classes T2|The Thing in the Wardrobe|story","group":"Classes T2","name":"The Thing in the Wardrobe","field":"story","text":"It becomes whatever you fear most. Yours becomes a very disappointed aunt. You laugh, and it shrinks."},{"id":"Classes T2|The Midnight Growing Dance|story","group":"Classes T2","name":"The Midnight Growing Dance","field":"story","text":"Thistlewood says seedlings grow faster if you dance round them at midnight. She is right, and there are photographs."},{"id":"Classes T2|Carnivorous Care|story","group":"Classes T2","name":"Carnivorous Care","field":"story","text":"The flytrap in the corner sings for its supper. The song is catchy. The supper is somebody's glove."},{"id":"Classes T2|Interviewing Portraits|story","group":"Classes T2","name":"Interviewing Portraits","field":"story","text":"The portraits remember everything and agree on nothing. Your essay has four endings."},{"id":"Classes T2|Treasure Maps & Their Lies|story","group":"Classes T2","name":"Treasure Maps & Their Lies","field":"story","text":"Every treasure map in the archive is lying, Vesper says. The trick is to work out which way."},{"id":"Items T2|Cloak That Only Hides Your Feet|origin","group":"Items T2","name":"Cloak That Only Hides Your Feet","field":"origin","text":"Excellent for sneaking, as long as nobody looks down. Somebody always looks down."},{"id":"Items T2|Borrowed Red Dancing Shoes|origin","group":"Items T2","name":"Borrowed Red Dancing Shoes","field":"origin","text":"Click the heels three times and you are home. You have not yet worked out how to come back."},{"id":"Items T2|Spinning Top That Never Falls|origin","group":"Items T2","name":"Spinning Top That Never Falls","field":"origin","text":"Spin it to check you're awake. It has never once stopped. You try not to think about that."},{"id":"Items T2|Mittens That Hold Hands|origin","group":"Items T2","name":"Mittens That Hold Hands","field":"origin","text":"Knitted as a pair and never happy apart. In a pinch they will hold someone else's hand for you."},{"id":"Items T2|Hot-Water-Bottle Dragon|origin","group":"Items T2","name":"Hot-Water-Bottle Dragon","field":"origin","text":"Sold as a hot-water bottle. It hatched on the first cold night and has been toasty, and hungry, ever since."},{"id":"Items T2|Potion Kit in a Lunchbox|origin","group":"Items T2","name":"Potion Kit in a Lunchbox","field":"origin","text":"Every vial is labelled in a child's handwriting. One just says 'NO'."},{"id":"Items T2|Telescope That Sees Yesterday|origin","group":"Items T2","name":"Telescope That Sees Yesterday","field":"origin","text":"Point it at the lake and you see last Tuesday. Point it at the staff room and you learn far too much."},{"id":"Items T2|Jar of Bottled Laughter|origin","group":"Items T2","name":"Jar of Bottled Laughter","field":"origin","text":"Uncork it and the whole room laughs for a minute. Nobody ever knows at what."},{"id":"Items T2|Marmalade Sandwich in a Hat|origin","group":"Items T2","name":"Marmalade Sandwich in a Hat","field":"origin","text":"Kept under your hat for emergencies. In a real emergency it is the best sandwich you have ever eaten."},{"id":"Items T2|Watering Can That Hums|origin","group":"Items T2","name":"Watering Can That Hums","field":"origin","text":"It waters only what's thirsty, and hums a lullaby to whatever is asleep."},{"id":"Friends T2|The Snowball Champion|story","group":"Friends T2","name":"The Snowball Champion","field":"story","text":"Undefeated since the age of four. Her throwing arm is famous in three villages and one small mountain."},{"id":"Friends T2|Rat Who Cooks Better Than the Cooks|story","group":"Friends T2","name":"Rat Who Cooks Better Than the Cooks","field":"story","text":"He steers you round the kitchens by tugging your hair. The soup has never been better. Nobody must ever know."},{"id":"Friends T2|Yeti Who Lost His Mittens|story","group":"Friends T2","name":"Yeti Who Lost His Mittens","field":"story","text":"Huge, shy and very cold-handed. You knitted him mittens. He knitted you a scarf the size of a carpet."},{"id":"Friends T2|Prefect Who Secretly Loves Mischief|story","group":"Friends T2","name":"Prefect Who Secretly Loves Mischief","field":"story","text":"She writes up every rule you break in perfect detail, then files the reports in the fireplace."},{"id":"Friends T2|Ghost Who Only Haunts at Teatime|story","group":"Friends T2","name":"Ghost Who Only Haunts at Teatime","field":"story","text":"Four o'clock sharp, every day, with a rattling chain and an empty cup. You've started pouring him one."},{"id":"Friends T2|Boy Who Winds the Clock Tower|story","group":"Friends T2","name":"Boy Who Winds the Clock Tower","field":"story","text":"He climbs up every midnight to wind the great clock, and has opinions about everyone who's ever been late."},{"id":"Friends T2|Girl with a Pet Shadow|story","group":"Friends T2","name":"Girl with a Pet Shadow","field":"story","text":"Her shadow runs a second ahead of her and tells her where the prefects are."},{"id":"Friends T2|Chess-Club Strategist|story","group":"Friends T2","name":"Chess-Club Strategist","field":"story","text":"She plays four games at once and apologises before every checkmate."},{"id":"Mischief T2|Made It Snow on the Staff Table|story","group":"Mischief T2","name":"Made It Snow on the Staff Table","field":"story","text":"Only on the staff table, and only on pudding. The Headmistress caught a flake on her tongue and pretended not to."},{"id":"Mischief T2|Swapped the Sugar for Sneezing Powder|story","group":"Mischief T2","name":"Swapped the Sugar for Sneezing Powder","field":"story","text":"Breakfast lasted three times as long. Every sneeze was blessed by four people. It was, honestly, lovely."},{"id":"Mischief T2|Skated on the Lake at Midnight|story","group":"Mischief T2","name":"Skated on the Lake at Midnight","field":"story","text":"The lake creature watched your figure-eights. At the end it clapped one enormous tentacle on the ice."},{"id":"Mischief T2|Ran a Book on the Duelling Club|story","group":"Mischief T2","name":"Ran a Book on the Duelling Club","field":"story","text":"You gave the captain long odds against himself. He won out of spite, and you won more."},{"id":"Mischief T2|Hosted a Secret Midnight Feast|story","group":"Mischief T2","name":"Hosted a Secret Midnight Feast","field":"story","text":"Thirty first-years, four cakes and one creaky floorboard. Nobody stepped on it. Nobody."},{"id":"Mischief T2|Taught the Portraits to Sing Carols|story","group":"Mischief T2","name":"Taught the Portraits to Sing Carols","field":"story","text":"By midnight every frame in the castle was harmonising. The gloomy one in the dungeon has a beautiful baritone."},{"id":"Classes T3|Binding & Unbinding|story","group":"Classes T3","name":"Binding & Unbinding","field":"story","text":"Pimm ties a knot in the air and asks you to untie it without touching it. You nearly do."},{"id":"Classes T3|Dreamless & Deadly|story","group":"Classes T3","name":"Dreamless & Deadly","field":"story","text":"Gall hands out two vials, one of which would put you to sleep for a week. He will not say which."},{"id":"Classes T3|Duelling Gambits|story","group":"Classes T3","name":"Duelling Gambits","field":"story","text":"Hartley teaches you that the best defence is to appear to have no plan at all."},{"id":"Classes T3|Rare & Dangerous Plants|story","group":"Classes T3","name":"Rare & Dangerous Plants","field":"story","text":"You will be graded on how many fingers you still have. Thistlewood is not joking."},{"id":"Classes T3|Lost Histories of the Castle|story","group":"Classes T3","name":"Lost Histories of the Castle","field":"story","text":"Vesper opens a door you have walked past every day and shows you a room that wasn't there."},{"id":"Items T3|Founder's Chipped Teacup|origin","group":"Items T3","name":"Founder's Chipped Teacup","field":"origin","text":"Whoever drinks from it hears the school's oldest stories, which are mostly gossip."},{"id":"Items T3|Wand Core of Singing Wood|origin","group":"Items T3","name":"Wand Core of Singing Wood","field":"origin","text":"The wood hums when you are close to something true. It hummed all the way through the exam."},{"id":"Items T3|Ever-Brimming Flask|origin","group":"Items T3","name":"Ever-Brimming Flask","field":"origin","text":"Never empty, never the same. The last student to use it was found a week later, delighted and unable to speak."},{"id":"Items T3|Scroll of One Perfect Answer|origin","group":"Items T3","name":"Scroll of One Perfect Answer","field":"origin","text":"Write the question, burn the scroll, and for exactly one moment you know. You will not remember it afterwards."},{"id":"Items T3|Gryphon-Feather Quill|origin","group":"Items T3","name":"Gryphon-Feather Quill","field":"origin","text":"It writes in a hand you do not recognise, with a conviction you wish you had."},{"id":"Friends T3|The Teacher Who Believes in You|story","group":"Friends T3","name":"The Teacher Who Believes in You","field":"story","text":"She stays late to hear you explain a spell wrong, then right, then wrong again, then right."},{"id":"Friends T3|Sworn Rival Turned Ally|story","group":"Friends T3","name":"Sworn Rival Turned Ally","field":"story","text":"Neither of you will say it out loud. You both knew from the moment the fog came in."},{"id":"Friends T3|Exchange Student with a Secret|story","group":"Friends T3","name":"Exchange Student with a Secret","field":"story","text":"She knows how the Founders really got along. She will tell you at the very end of the year."},{"id":"Friends T3|Year-Mate Who Always Knew|story","group":"Friends T3","name":"Year-Mate Who Always Knew","field":"story","text":"She says she did not predict this. The note in her desk, dated September, says otherwise."},{"id":"Mischief T3|Hid the Examiner's Hat|story","group":"Mischief T3","name":"Hid the Examiner's Hat","field":"story","text":"It was found a week later on the astronomy tower, wearing a small scarf."},{"id":"Mischief T3|Opened the Forbidden Corridor|story","group":"Mischief T3","name":"Opened the Forbidden Corridor","field":"story","text":"You walked in. You walked out. You will not discuss what was in between."},{"id":"Mischief T3|Swapped Every Name Tag|story","group":"Mischief T3","name":"Swapped Every Name Tag","field":"story","text":"For one glorious day the whole school was addressed as someone else. Nobody stopped you."},{"id":"Classes T3|Stopping What You Started|story","group":"Classes T3","name":"Stopping What You Started","field":"story","text":"Pimm sets every broom in the castle dancing and asks you to stop them politely. The last one takes a bow."},{"id":"Classes T3|Singing in the Downpour|story","group":"Classes T3","name":"Singing in the Downpour","field":"story","text":"Pimm brings a storm indoors and asks you to stay dry. You splash every puddle on the way out anyway."},{"id":"Classes T3|The Battle of Wits|story","group":"Classes T3","name":"The Battle of Wits","field":"story","text":"Two goblets, one poisoned. Gall has, of course, poisoned both, and spent years building up an immunity."},{"id":"Classes T3|Growing Pains Elixir|story","group":"Classes T3","name":"Growing Pains Elixir","field":"story","text":"You grow your toad to the size of a pony. He is still exactly as unimpressed."},{"id":"Classes T3|Fighting Fair & Foul|story","group":"Classes T3","name":"Fighting Fair & Foul","field":"story","text":"Hartley teaches you every dirty trick, then makes you promise never to use them. You keep your fingers crossed."},{"id":"Classes T3|Dragon Etiquette|story","group":"Classes T3","name":"Dragon Etiquette","field":"story","text":"Rule one: never look a dragon in the eye unless you have been properly introduced. Rule two: bow."},{"id":"Classes T3|Waking the Old Oak|story","group":"Classes T3","name":"Waking the Old Oak","field":"story","text":"The oldest tree on the grounds opens one eye. It has waited four hundred years for someone to say hello."},{"id":"Classes T3|The Walled Garden|story","group":"Classes T3","name":"The Walled Garden","field":"story","text":"Behind the ivy is a door nobody has opened in a century. Thistlewood hands you the key and pretends she lost it."},{"id":"Classes T3|When History Wakes|story","group":"Classes T3","name":"When History Wakes","field":"story","text":"At midnight the armour in the trophy room steps down and re-enacts the Battle of the Bridge. Vesper takes notes."},{"id":"Classes T3|The Two Doors|story","group":"Classes T3","name":"The Two Doors","field":"story","text":"One door always lies and one always tells the truth. Vesper's third door just wants to be included."},{"id":"Items T3|Shield of the First Headmistress|origin","group":"Items T3","name":"Shield of the First Headmistress","field":"origin","text":"It has turned aside a dragon, two duels and one extremely angry swan."},{"id":"Items T3|Trowel from the Founder's Garden|origin","group":"Items T3","name":"Trowel from the Founder's Garden","field":"origin","text":"Anything planted with it comes up stubborn, cheerful and a little too large."},{"id":"Items T3|Key to the Clock Tower|origin","group":"Items T3","name":"Key to the Clock Tower","field":"origin","text":"Turn it at the stroke of the hour and the moment holds still. The lightning, you were told, is optional."},{"id":"Items T3|Hourglass of One Do-Over|origin","group":"Items T3","name":"Hourglass of One Do-Over","field":"origin","text":"Turn it over and today happens again. You'll get it right this time. Probably."},{"id":"Items T3|Bicycle That Flies Past the Moon|origin","group":"Items T3","name":"Bicycle That Flies Past the Moon","field":"origin","text":"It only flies with a friend in the basket. You have never once ridden it alone."},{"id":"Items T3|Pressed-Flower Diary|origin","group":"Items T3","name":"Pressed-Flower Diary","field":"origin","text":"Every page holds a flower and a secret. The flowers are still alive."},{"id":"Items T3|Gloves of the Undefeated|origin","group":"Items T3","name":"Gloves of the Undefeated","field":"origin","text":"Worn by a champion who never once won a duel, and never once lost one either."},{"id":"Items T3|Teapot That Pours What You Need|origin","group":"Items T3","name":"Teapot That Pours What You Need","field":"origin","text":"Tea for the tired, cocoa for the sad and once, for a crying first-year, an entire small sponge cake."},{"id":"Items T3|Luckdragon Scale|origin","group":"Items T3","name":"Luckdragon Scale","field":"origin","text":"Pearly, warm and as big as a dinner plate. Hold it and you feel, for no reason at all, that things will turn out fine."},{"id":"Items T3|Book That Reads Itself Aloud|origin","group":"Items T3","name":"Book That Reads Itself Aloud","field":"origin","text":"It does all the voices. Its villains are so good that the librarian has asked it to tone them down."},{"id":"Friends T3|The Caretaker's Enormous Soft Dog|story","group":"Friends T3","name":"The Caretaker's Enormous Soft Dog","field":"story","text":"He was meant to guard the forbidden corridor. He guards you now, mostly by lying on your feet."},{"id":"Friends T3|Head Girl Who Was Once Just Like You|story","group":"Friends T3","name":"Head Girl Who Was Once Just Like You","field":"story","text":"She was the smallest first-year once, too. She tells you so at exactly the right moment."},{"id":"Friends T3|Knight in the Portrait Who Won't Yield|story","group":"Friends T3","name":"Knight in the Portrait Who Won't Yield","field":"story","text":"He lost both arms in a portrait duel and insists it is merely a flesh wound."},{"id":"Friends T3|Dragon Keeper's Apprentice|story","group":"Friends T3","name":"Dragon Keeper's Apprentice","field":"story","text":"Her eyebrows grow back faster than anyone's, and her dragon sends you postcards."},{"id":"Friends T3|Ghost Who Is Afraid of Students|story","group":"Friends T3","name":"Ghost Who Is Afraid of Students","field":"story","text":"He hides behind the curtains, trembling. 'I see living people,' he whispers. 'Everywhere.'"},{"id":"Friends T3|The Map-Maker's Daughter|story","group":"Friends T3","name":"The Map-Maker's Daughter","field":"story","text":"She has drawn the whole castle from memory, including three rooms that don't exist yet."},{"id":"Friends T3|Rival's Little Sister, Your Spy|story","group":"Friends T3","name":"Rival's Little Sister, Your Spy","field":"story","text":"She charges in sweets and reports in rhyme."},{"id":"Friends T3|The Masked Fencer|story","group":"Friends T3","name":"The Masked Fencer","field":"story","text":"He came with the visiting school, never gives his name, and is looking for someone. You hope it isn't you."},{"id":"Mischief T3|Pulled the Trophy Room Heist|story","group":"Mischief T3","name":"Pulled the Trophy Room Heist","field":"story","text":"Eleven first-years, one plan, a dangling rope, and a trophy swapped for a very convincing teapot."},{"id":"Mischief T3|Dangled from the Library Ceiling|story","group":"Mischief T3","name":"Dangled from the Library Ceiling","field":"story","text":"One rope, one torch, and one bead of sweat you caught a hair before it hit the floor."},{"id":"Mischief T3|Gave the Founder's Statue a Moustache|story","group":"Mischief T3","name":"Gave the Founder's Statue a Moustache","field":"story","text":"The statue loves it. It will not let anyone wash it off."},{"id":"Mischief T3|Released a Thousand Balloons from the Tower|story","group":"Mischief T3","name":"Released a Thousand Balloons from the Tower","field":"story","text":"For one moment the whole castle looked as if it might float away. Nobody minded the idea."},{"id":"Mischief T3|Folded the Exam Papers into Birds|story","group":"Mischief T3","name":"Folded the Exam Papers into Birds","field":"story","text":"They flew out of the hall in a long white ribbon. A few came back with answers."},{"id":"Mischief T3|Started the Leaving-Feast Food Fight|story","group":"Mischief T3","name":"Started the Leaving-Feast Food Fight","field":"story","text":"It began with one pea. It ended with the Headmaster wearing a trifle and laughing."},{"id":"Events T1|The Staircases Go Wrong|intro","group":"Events T1","name":"The Staircases Go Wrong","field":"intro","text":"Halfway through the first week every staircase in the castle decides, at once, to go somewhere else. First-years are stranded on landings with no way up or down."},{"id":"Events T1|The Staircases Go Wrong / Chart the new pattern|approach story","group":"Events T1","name":"The Staircases Go Wrong / Chart the new pattern","field":"approach story","text":"You spot the rhythm and call it out like a dance."},{"id":"Events T1|The Staircases Go Wrong / Float the stranded to safety|approach story","group":"Events T1","name":"The Staircases Go Wrong / Float the stranded to safety","field":"approach story","text":"You loop a gentle spell around each one and haul them across."},{"id":"Events T1|The Staircases Go Wrong / Hold the landing|approach story","group":"Events T1","name":"The Staircases Go Wrong / Hold the landing","field":"approach story","text":"You brace against the biggest staircase and stand until the others cross."},{"id":"Events T1|The Staircases Go Wrong|holds","group":"Events T1","name":"The Staircases Go Wrong","field":"holds","text":"By dusk every first-year is back where they belong. The staircases sulk for a week."},{"id":"Events T1|The Staircases Go Wrong|suffers","group":"Events T1","name":"The Staircases Go Wrong","field":"suffers","text":"A few students sleep on landings. The rest of the school pretends not to see them."},{"id":"Events T1|The Greenhouse Breaks Loose|intro","group":"Events T1","name":"The Greenhouse Breaks Loose","field":"intro","text":"Tray nine's humming has become singing. At supper a tendril the size of a cart horse knocks on the Great Hall window."},{"id":"Events T1|The Greenhouse Breaks Loose / Coax the vines home|approach story","group":"Events T1","name":"The Greenhouse Breaks Loose / Coax the vines home","field":"approach story","text":"You hum back. The vine hesitates, and then leans in."},{"id":"Events T1|The Greenhouse Breaks Loose / Brew a sleeping mist|approach story","group":"Events T1","name":"The Greenhouse Breaks Loose / Brew a sleeping mist","field":"approach story","text":"A bottle, a cork, and a very careful throw."},{"id":"Events T1|The Greenhouse Breaks Loose / Hack through the thorns|approach story","group":"Events T1","name":"The Greenhouse Breaks Loose / Hack through the thorns","field":"approach story","text":"You go in with a borrowed pair of shears and come out with a story."},{"id":"Events T1|The Greenhouse Breaks Loose|holds","group":"Events T1","name":"The Greenhouse Breaks Loose","field":"holds","text":"The plants are returned, mostly. Thistlewood cries a little."},{"id":"Events T1|The Greenhouse Breaks Loose|suffers","group":"Events T1","name":"The Greenhouse Breaks Loose","field":"suffers","text":"Tray nine is now the garden. Nobody dares go near it."},{"id":"Events T1|The Fog That Whispers|intro","group":"Events T1","name":"The Fog That Whispers","field":"intro","text":"A grey fog rolls up from the lake and into the corridors. It says your name in a voice you almost recognise."},{"id":"Events T1|The Fog That Whispers / Work out what it wants|approach story","group":"Events T1","name":"The Fog That Whispers / Work out what it wants","field":"approach story","text":"You sit down in it, listen, and write a list of everything it repeats."},{"id":"Events T1|The Fog That Whispers / Charm it quiet|approach story","group":"Events T1","name":"The Fog That Whispers / Charm it quiet","field":"approach story","text":"A hush spell, a small lie, and the fog settles like a cat."},{"id":"Events T1|The Fog That Whispers / Burn sage and shout back|approach story","group":"Events T1","name":"The Fog That Whispers / Burn sage and shout back","field":"approach story","text":"It's very loud, and very green, and it works."},{"id":"Events T1|The Fog That Whispers|holds","group":"Events T1","name":"The Fog That Whispers","field":"holds","text":"The fog drifts back to the lake. In its place you find a single, small blue stone."},{"id":"Events T1|The Fog That Whispers|suffers","group":"Events T1","name":"The Fog That Whispers","field":"suffers","text":"The fog lingers for days. People stop answering to their own names."},{"id":"Events T2|The Library Wakes Up|intro","group":"Events T2","name":"The Library Wakes Up","field":"intro","text":"At midnight, the books lift off their shelves and begin to argue. Soon they are throwing each other. Someone has left a window open on the Restricted Section."},{"id":"Events T2|The Library Wakes Up / Read them a bedtime story|approach story","group":"Events T2","name":"The Library Wakes Up / Read them a bedtime story","field":"approach story","text":"The oldest book listens first. The rest fall in line."},{"id":"Events T2|The Library Wakes Up / Cast a binding over the shelves|approach story","group":"Events T2","name":"The Library Wakes Up / Cast a binding over the shelves","field":"approach story","text":"Every spine in the room goes rigid at once."},{"id":"Events T2|The Library Wakes Up / Wade in and snatch the worst of them|approach story","group":"Events T2","name":"The Library Wakes Up / Wade in and snatch the worst of them","field":"approach story","text":"A history of dragons catches you on the nose. You win anyway."},{"id":"Events T2|The Library Wakes Up|holds","group":"Events T2","name":"The Library Wakes Up","field":"holds","text":"Order returns. Three books are missing, but nobody is willing to say which."},{"id":"Events T2|The Library Wakes Up|suffers","group":"Events T2","name":"The Library Wakes Up","field":"suffers","text":"The library is closed for a month. A few volumes now refuse to be read by anyone."},{"id":"Events T2|The Lake Rises|intro","group":"Events T2","name":"The Lake Rises","field":"intro","text":"After three days of rain the lake climbs the lawn and starts pushing at the castle doors. Something in it is making waves on purpose."},{"id":"Events T2|The Lake Rises / Brew a draught to calm the water|approach story","group":"Events T2","name":"The Lake Rises / Brew a draught to calm the water","field":"approach story","text":"A large pot, a larger spoon, and a lot of leaning over the edge."},{"id":"Events T2|The Lake Rises / Plant a wall of reeds|approach story","group":"Events T2","name":"The Lake Rises / Plant a wall of reeds","field":"approach story","text":"Every student with a spade lines up. It turns into a long, wet, friendly day."},{"id":"Events T2|The Lake Rises / Face what's in the lake|approach story","group":"Events T2","name":"The Lake Rises / Face what's in the lake","field":"approach story","text":"It is bigger than you. It is also, you realise, just lonely."},{"id":"Events T2|The Lake Rises|holds","group":"Events T2","name":"The Lake Rises","field":"holds","text":"The lake settles back. The creature gives the school a long, apologetic look."},{"id":"Events T2|The Lake Rises|suffers","group":"Events T2","name":"The Lake Rises","field":"suffers","text":"The lower corridors flood. The dungeons are lost for weeks."},{"id":"Events T2|The Visiting Duellists|intro","group":"Events T2","name":"The Visiting Duellists","field":"intro","text":"A rival school arrives for a friendly tournament. They are not friendly. The head duellist has already insulted four teachers, a ghost, and the cook."},{"id":"Events T2|The Visiting Duellists / Out-think their strategy|approach story","group":"Events T2","name":"The Visiting Duellists / Out-think their strategy","field":"approach story","text":"You find the pattern in her opening and lean on it."},{"id":"Events T2|The Visiting Duellists / Meet them hex for hex|approach story","group":"Events T2","name":"The Visiting Duellists / Meet them hex for hex","field":"approach story","text":"You do not win every round, but you never give any ground."},{"id":"Events T2|The Visiting Duellists / Spoil their potions at breakfast|approach story","group":"Events T2","name":"The Visiting Duellists / Spoil their potions at breakfast","field":"approach story","text":"A drop of this, a dash of that. It looks so innocent."},{"id":"Events T2|The Visiting Duellists|holds","group":"Events T2","name":"The Visiting Duellists","field":"holds","text":"The visitors leave with respect and a cake. The head duellist writes you a letter."},{"id":"Events T2|The Visiting Duellists|suffers","group":"Events T2","name":"The Visiting Duellists","field":"suffers","text":"The visitors win every match. The school hangs its head and reaches for the cake."},{"id":"Events T3|The Night the Wards Fail|intro","group":"Events T3","name":"The Night the Wards Fail","field":"intro","text":"At the stroke of midnight the old protections around the castle blink out, one by one. Something is circling, patient, outside the gate."},{"id":"Events T3|The Night the Wards Fail / Rebuild the wards|approach story","group":"Events T3","name":"The Night the Wards Fail / Rebuild the wards","field":"approach story","text":"Layer by layer, line by line, you stitch the old magic back."},{"id":"Events T3|The Night the Wards Fail / Rally the students into a line|approach story","group":"Events T3","name":"The Night the Wards Fail / Rally the students into a line","field":"approach story","text":"No heroes. Everyone holds their place, and the line holds."},{"id":"Events T3|The Night the Wards Fail / Ride out and meet it|approach story","group":"Events T3","name":"The Night the Wards Fail / Ride out and meet it","field":"approach story","text":"You go alone, because the others need to be here. You were never alone."},{"id":"Events T3|The Night the Wards Fail|holds","group":"Events T3","name":"The Night the Wards Fail","field":"holds","text":"The wards flare back. In the morning, the thing outside the gate is gone and only a single feather remains."},{"id":"Events T3|The Night the Wards Fail|suffers","group":"Events T3","name":"The Night the Wards Fail","field":"suffers","text":"The wards flicker out for good. The castle is a little colder from then on."},{"id":"Events T3|The Examiner Arrives|intro","group":"Events T3","name":"The Examiner Arrives","field":"intro","text":"The Grand Examiner has come to test the year's work. He is tall, silent, and carries a clipboard that seems to be listening."},{"id":"Events T3|The Examiner Arrives / Answer from the books|approach story","group":"Events T3","name":"The Examiner Arrives / Answer from the books","field":"approach story","text":"Every answer comes up neat and perfect. He writes nothing."},{"id":"Events T3|The Examiner Arrives / Brew the test potion|approach story","group":"Events T3","name":"The Examiner Arrives / Brew the test potion","field":"approach story","text":"It turns the colour you hoped for. He tastes it and nods."},{"id":"Events T3|The Examiner Arrives / Show him a living garden|approach story","group":"Events T3","name":"The Examiner Arrives / Show him a living garden","field":"approach story","text":"A greenhouse built by the whole year. He stays an hour."},{"id":"Events T3|The Examiner Arrives|holds","group":"Events T3","name":"The Examiner Arrives","field":"holds","text":"The Examiner leaves a single line in the register: 'Remarkable.'"},{"id":"Events T3|The Examiner Arrives|suffers","group":"Events T3","name":"The Examiner Arrives","field":"suffers","text":"He leaves without a word. The register says only, 'Noted.'"},{"id":"Events T3|The Long Dark|intro","group":"Events T3","name":"The Long Dark","field":"intro","text":"Every candle in the castle gutters out at once. The dark is not empty. It is full of footsteps, none of them your classmates'."},{"id":"Events T3|The Long Dark / Light the way with a charm|approach story","group":"Events T3","name":"The Long Dark / Light the way with a charm","field":"approach story","text":"A single glowing thread, and a line of students holding it."},{"id":"Events T3|The Long Dark / Brew a lamp of lasting light|approach story","group":"Events T3","name":"The Long Dark / Brew a lamp of lasting light","field":"approach story","text":"It's slow, it's careful, and it gives off a glow like morning."},{"id":"Events T3|The Long Dark / Hold hands and walk it out|approach story","group":"Events T3","name":"The Long Dark / Hold hands and walk it out","field":"approach story","text":"The old plants glow when they sense the group. They lead you all home."},{"id":"Events T3|The Long Dark|holds","group":"Events T3","name":"The Long Dark","field":"holds","text":"Dawn finds everyone in the Great Hall, asleep in a heap. Nobody mentions the footsteps."},{"id":"Events T3|The Long Dark|suffers","group":"Events T3","name":"The Long Dark","field":"suffers","text":"Some students never speak of that night. Some candles never relight."},{"id":"Powers|Gryffindor: The Dare|story","group":"Powers","name":"Gryffindor: The Dare","field":"story","text":"You said it loudly enough that the whole corridor heard. Backing down was no longer an option."},{"id":"Powers|Gryffindor: Stand Your Ground|story","group":"Powers","name":"Gryffindor: Stand Your Ground","field":"story","text":"The hex hit you square in the chest. You were still standing when the smoke cleared, and annoyed."},{"id":"Powers|Gryffindor: Rally Cry|story","group":"Powers","name":"Gryffindor: Rally Cry","field":"story","text":"You shouted something that did not quite rhyme. Everyone found it oddly stirring."},{"id":"Powers|Gryffindor: Knock-Away Hex|story","group":"Powers","name":"Gryffindor: Knock-Away Hex","field":"story","text":"Their wand spun across the hall and landed, point down, in someone's soup."},{"id":"Powers|Gryffindor: The Golden Chase|story","group":"Powers","name":"Gryffindor: The Golden Chase","field":"story","text":"One small glint, one very long dive, and the whole school holding its breath."},{"id":"Powers|Slytherin: Summoning Charm|story","group":"Powers","name":"Slytherin: Summoning Charm","field":"story","text":"You only meant to practise. The item arrived with a small, apologetic thump."},{"id":"Powers|Slytherin: Cloak of Quiet Hours|story","group":"Powers","name":"Slytherin: Cloak of Quiet Hours","field":"story","text":"It was found in a trunk with a note: 'Not for sale. Not for borrowing. Not for you.'"},{"id":"Powers|Slytherin: Draught of Another Face|story","group":"Powers","name":"Slytherin: Draught of Another Face","field":"story","text":"It tasted of pennies and old pears. For an hour, you were wonderfully ordinary."},{"id":"Powers|Slytherin: Pass the Blame|story","group":"Powers","name":"Slytherin: Pass the Blame","field":"story","text":"You looked at the prefect, then at the person behind you, and let the silence do the work."},{"id":"Powers|Slytherin: Quiet Bargain|story","group":"Powers","name":"Slytherin: Quiet Bargain","field":"story","text":"A whisper, a coin, and a book changed hands behind a pillar."},{"id":"Powers|Ravenclaw: Chart of the Sleeping Castle|story","group":"Powers","name":"Ravenclaw: Chart of the Sleeping Castle","field":"story","text":"Every corridor on it glows faintly where someone is thinking too hard."},{"id":"Powers|Ravenclaw: The Room That Provides|story","group":"Powers","name":"Ravenclaw: The Room That Provides","field":"story","text":"The door was not there yesterday. Behind it was exactly the thing you were about to ask for."},{"id":"Powers|Ravenclaw: Read Ahead|story","group":"Powers","name":"Ravenclaw: Read Ahead","field":"story","text":"You finished the term's reading in the first week and started on next term's out of spite."},{"id":"Powers|Ravenclaw: Cross-Reference|story","group":"Powers","name":"Ravenclaw: Cross-Reference","field":"story","text":"Page 41 contradicts page 212. You noticed, and wrote a very polite letter."},{"id":"Powers|Ravenclaw: Perfect Recall|story","group":"Powers","name":"Ravenclaw: Perfect Recall","field":"story","text":"You remember exactly how the scroll's last line went. Unfortunately, so does the scroll."},{"id":"Powers|Hufflepuff: Faithful Friend|story","group":"Powers","name":"Hufflepuff: Faithful Friend","field":"story","text":"You sat with them through the whole hour. It was dull, and it counted."},{"id":"Powers|Hufflepuff: Shortcut Behind the Tapestry|story","group":"Powers","name":"Hufflepuff: Shortcut Behind the Tapestry","field":"story","text":"Everybody else went the long way round. You had biscuits for them at the far end."},{"id":"Powers|Hufflepuff: Borrowed Quill|story","group":"Powers","name":"Hufflepuff: Borrowed Quill","field":"story","text":"It writes better for her, you noticed, and decided you were glad."},{"id":"Powers|Hufflepuff: Safe Harbor|story","group":"Powers","name":"Hufflepuff: Safe Harbor","field":"story","text":"Whatever else happens in the dark, the kitchen door is always unlocked."},{"id":"Powers|Hufflepuff: Study Group|story","group":"Powers","name":"Hufflepuff: Study Group","field":"story","text":"Nobody planned it. By the third night the whole table had matching notes."}];
const KEY="wizard-review-v1";let S={};
try{S=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const groups=[...new Set(E.map(e=>e.group))];
$("grp").innerHTML='<option value="">All groups ('+E.length+')</option>'+groups.map(g=>'<option>'+g+'</option>').join("");
let unr=false;
function stat(){const v=Object.values(S);const u=v.filter(x=>x.v===1).length,d=v.filter(x=>x.v===-1).length;
 $("stat").textContent=(u+d)+" of "+E.length+" reviewed · "+u+" up · "+d+" down"}
function draw(){const g=$("grp").value;const el=$("list");el.innerHTML="";
 E.forEach((e,i)=>{if(g&&e.group!==g)return;const s=S[e.id]||{};if(unr&&s.v)return;
  const c=document.createElement("div");c.className="card"+(s.v===1?" u":s.v===-1?" d":"");
  const m=document.createElement("div");m.className="meta";m.textContent=e.group+" · "+e.field;
  const n=document.createElement("div");n.className="name";n.textContent=e.name;
  const t=document.createElement("div");t.className="text";t.textContent=e.text;
  const v=document.createElement("div");v.className="vote";
  const mk=(cls,label,val)=>{const b=document.createElement("button");b.className=cls+(s.v===val?" on":"");b.textContent=label;b.setAttribute("aria-label",cls);
   b.onclick=()=>{S[e.id]={...(S[e.id]||{}),v:s.v===val?0:val};save();stat();draw()};return b};
  v.append(mk("up","👍",1),mk("down","👎",-1));
  if(s.v===-1){const nt=document.createElement("input");nt.className="note";nt.placeholder="Why? (optional)";nt.value=s.n||"";
   nt.oninput=()=>{S[e.id].n=nt.value;save()};v.append(nt)}
  c.append(m,n,t,v);el.append(c)})}
$("grp").onchange=draw;$("unr").onclick=()=>{unr=!unr;$("unr").classList.toggle("on",unr);draw()};
$("fin").onclick=()=>{const down=E.filter(e=>(S[e.id]||{}).v===-1);
 const up=E.filter(e=>(S[e.id]||{}).v===1).length,left=E.length-up-down.length;
 let o="CARD TEXT REVIEW: "+down.length+" down, "+up+" up, "+left+" unreviewed\nReplace each DOWN text with a better one in the same voice.\n";
 down.forEach(e=>{const n=(S[e.id]||{}).n;o+="\nDOWN | "+e.group+" | "+e.name+" | "+e.field+"\n  \""+e.text+"\""+(n?"\n  note: "+n:"")+"\n"});
 $("out").value=o;$("cpmsg").textContent="";$("dlg").showModal()};
$("cl").onclick=()=>$("dlg").close();
$("cp").onclick=async()=>{try{await navigator.clipboard.writeText($("out").value);$("cpmsg").textContent="Copied."}
 catch(e){$("out").select();$("cpmsg").textContent="Select-all and copy manually."}};
stat();draw();
</script></body></html>
