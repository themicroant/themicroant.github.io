<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>🕵️ Thief's Plotting Pad</title>
<style>
:root {
  --bg-0: #0c1210;
  --bg-1: #152420;
  --bg-2: #1d332c;
  --bg-3: #2a4a3f;
  --accent: #f0c674;
  --text: #e8f0ea;
  --text-dim: #9fc4ac;
  --border: #3d6656;
  --danger: #e0555e;
  --good: #7ec98f;

  --room-mustard: #6b5a1f;
  --room-scarlet: #6b2a2a;
  --room-green: #245c34;
  --room-white: #4a5a55;
  --room-plum: #4a2a5c;
  --room-peacock: #1f4a63;
  --room-power: #5c4a1f;
  --corridor: #223530;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg-0);
  color: var(--text);
  font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
  overscroll-behavior: none;
  touch-action: manipulation;
}
#app {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px;
  gap: 12px;
  max-width: 480px;
  margin: 0 auto;
}
h1, h2 { margin: 0; }
button {
  font-family: inherit;
  cursor: pointer;
  border: 2px solid var(--border);
  background: var(--bg-2);
  color: var(--text);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 14px;
}
button:hover:not(:disabled) { background: var(--bg-3); border-color: var(--accent); }
button:disabled { opacity: 0.4; cursor: default; }
button.primary { border-color: var(--accent); color: var(--accent); font-weight: bold; }
button.danger { border-color: var(--danger); color: var(--danger); }
button.success { border-color: var(--good); color: var(--good); }

.topbar {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
}
.topbar h1 { font-size: 1.1rem; color: var(--accent); }
.topbar .status { font-size: 0.85rem; color: var(--text-dim); }

main { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }

.step-label { color: var(--text-dim); font-size: 0.9rem; text-align: center; margin: 0; }

/* --- Museum grid --- */
.museum-grid {
  position: relative;
  display: grid;
  grid-template-columns: repeat(11, 1fr);
  grid-template-rows: repeat(11, 1fr);
  gap: 2px;
  width: 100%;
  max-width: 400px;
  aspect-ratio: 1 / 1;
  background: var(--bg-0);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 4px;
}
.cell {
  border: none;
  border-radius: 3px;
  padding: 0;
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(7px, 2.4vw, 13px);
  line-height: 1;
  background: var(--corridor);
  color: var(--text);
}
.cell.void { background: transparent; pointer-events: none; }
.cell.room { background: var(--bg-2); }
.cell.power { background: var(--room-power); }
.cell.corridor { background: var(--corridor); }
.cell.dim { opacity: 0.55; }
.cell.door { outline: 1px dashed var(--accent); outline-offset: -1px; }
.cell.marked { outline: 2px solid var(--accent); outline-offset: -2px; }
.cell.visited { box-shadow: inset 0 0 0 999px rgba(240, 198, 116, 0.12); }
.cell.drafted { box-shadow: inset 0 0 0 999px rgba(240, 198, 116, 0.28); }
.cell.current { outline: 2px solid var(--good); outline-offset: -2px; }

.trail-overlay { position: absolute; top: 0; left: 0; pointer-events: none; }
.trail-line { fill: none; stroke: var(--accent); stroke-width: 2; opacity: 0.85; }
.trail-dot { fill: var(--accent); }

/* --- Setup screen --- */
.setup-screen { align-items: center; }
.review-list { list-style: none; padding: 0; margin: 4px 0; text-align: center; color: var(--text-dim); }
.review-list li { padding: 2px 0; }
.nav-row { display: flex; gap: 10px; }

/* --- Play screen --- */
.play-screen { align-items: stretch; }
.panel {
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.counters { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-dim); flex-wrap: wrap; gap: 6px; }
.move-controls { display: flex; flex-direction: column; gap: 6px; }
.move-controls .hint { margin: 0; font-size: 0.82rem; color: var(--text-dim); }
.move-controls > div, .move-controls button { display: inline-block; }
.context-actions, .always-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.escape-picker { display: flex; flex-direction: column; gap: 6px; background: var(--bg-2); border-radius: 8px; padding: 10px; }
.escape-picker.hidden { display: none; }
.log { max-height: 220px; overflow-y: auto; background: var(--bg-0); border-radius: 8px; padding: 8px 10px; }
.log h2 { font-size: 0.85rem; color: var(--text-dim); margin: 0 0 4px; }
.log ol { margin: 0; padding-left: 18px; font-size: 0.8rem; color: var(--text-dim); }

/* --- Summary screen --- */
.summary-screen { align-items: center; text-align: center; gap: 14px; }
.summary-screen h2.success { color: var(--good); }
.summary-screen h2.danger { color: var(--danger); }

@media (max-width: 360px) {
  .panel { padding: 8px; }
  button { padding: 7px 9px; font-size: 13px; }
}
</style>
</head>
<body>
<div id="app"></div>
<script src="game-data.js"></script>
<script src="script.js"></script>
</body>
</html>
