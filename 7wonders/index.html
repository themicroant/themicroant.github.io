<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>🏛️ 7 Wonders</title>
<style>
:root {
  --bg-0: #0c1210;
  --bg-1: #152420;
  --bg-2: #1d332c;
  --bg-3: #2a4a3f;
  --accent: #f0c674;
  --text: #e8f0ea;
  --text-dim: #9fc4ac;
  --border: #3d6656;
  --danger: #e0555e;
  --good: #7ec98f;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  background: var(--bg-0);
  color: var(--text);
  font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
  overscroll-behavior: none;
  touch-action: manipulation;
}
#app {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  padding: 12px;
  max-width: 900px;
  margin: 0 auto;
  gap: 12px;
}

/* ---- status bar ---- */
.status-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 16px;
  flex-wrap: wrap;
  gap: 8px;
}
.status-bar h1 {
  font-size: 1.15rem;
  margin: 0;
  color: var(--accent);
  white-space: nowrap;
}
.status-chips {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 4px 10px;
  font-size: 0.85rem;
  color: var(--text-dim);
}
.chip strong { color: var(--text); font-weight: 600; }

/* ---- hand prompt ---- */
.hand-prompt {
  font-size: 0.9rem;
  color: var(--text-dim);
  padding: 0 4px;
}
.hand-prompt strong { color: var(--text); }

/* ---- hand ---- */
.hand-scroll {
  overflow-x: auto;
  overflow-y: visible;
  scroll-snap-type: x proximity;
  padding: 10px 4px 16px;
  -webkit-overflow-scrolling: touch;
}
.hand {
  display: flex;
  gap: 14px;
  min-width: min-content;
}
.card {
  scroll-snap-align: center;
  flex: 0 0 auto;
  width: 152px;
  background: var(--bg-1);
  border: 2px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font-family: inherit;
  padding: 0;
  display: flex;
  flex-direction: column;
  transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  transform: translateY(0);
}
.card:hover { border-color: var(--accent); transform: translateY(-4px); }
.card:focus-visible {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(240, 198, 116, 0.35);
}
.card[aria-selected="true"] {
  border-color: var(--accent);
  transform: translateY(-10px) scale(1.03);
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45), 0 0 0 2px var(--accent);
}
.card.unaffordable { opacity: 0.62; }

.card-head {
  padding: 10px 10px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.card-emoji { font-size: 2.1rem; line-height: 1; }
.card-name {
  font-size: 0.82rem;
  font-weight: 700;
  text-align: center;
  line-height: 1.15;
}
.card-type-label {
  font-size: 0.62rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  opacity: 0.85;
}
.card-body {
  background: var(--bg-2);
  padding: 8px 10px 10px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
  border-top: 1px solid var(--border);
}
.card-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  font-size: 0.78rem;
}
.card-row .label { color: var(--text-dim); font-size: 0.68rem; }
.icon-badge {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  background: var(--bg-3);
  border-radius: 6px;
  padding: 1px 5px;
  font-size: 0.78rem;
}
.lock-badge {
  margin-left: auto;
  font-size: 0.85rem;
}
.card-effect {
  font-size: 0.7rem;
  color: var(--text-dim);
  line-height: 1.3;
  font-style: italic;
}
.card-chain {
  font-size: 0.65rem;
  color: var(--good);
  line-height: 1.3;
}

/* ---- confirm bar ---- */
.confirm-bar {
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.confirm-info { font-size: 0.88rem; color: var(--text-dim); }
.confirm-info strong { color: var(--accent); }
button {
  font-family: inherit;
  cursor: pointer;
  border: 2px solid var(--border);
  background: var(--bg-2);
  color: var(--text);
  border-radius: 8px;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 600;
  transition: background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
}
button:hover:not(:disabled) { background: var(--bg-3); border-color: var(--accent); }
button:disabled { opacity: 0.4; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: #17140b; }
button.primary:hover:not(:disabled) { filter: brightness(1.08); }

.confirmed-panel {
  background: var(--bg-1);
  border: 1px solid var(--good);
  border-radius: 12px;
  padding: 20px;
  text-align: center;
}
.confirmed-panel .big-emoji { font-size: 2.5rem; }
.confirmed-panel h2 { color: var(--good); margin: 6px 0 4px; }
.confirmed-panel p { color: var(--text-dim); margin: 0 0 14px; }

@media (max-width: 400px) {
  .card { width: 128px; }
  .card-emoji { font-size: 1.7rem; }
  .status-bar h1 { font-size: 1rem; }
}
</style>
</head>
<body>
<div id="app"></div>
<script src="game-data.js"></script>
<script src="script.js"></script>
</body>
</html>
