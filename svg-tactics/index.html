<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>⚔️ Arcanum Tactics</title>
<style>
:root {
  --bg-0: #0a0d13;
  --bg-1: #121924;
  --bg-2: #1b2531;
  --bg-3: #28374a;
  --gold: #f0c674;
  --steel: #8fa4bc;
  --text: #e7edf5;
  --text-dim: #8fa0b5;
  --border: #2e3d50;
  --red: #e0555e;
  --green: #7ec98f;
  --blue-team: #4cc3ff;
  --red-team: #ff6b6b;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; min-height: 100%;
  background: radial-gradient(circle at 50% -10%, #182233, var(--bg-0) 65%);
  color: var(--text);
  font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
  overscroll-behavior: none;
  touch-action: manipulation;
}
#app { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; padding: 12px; }
h1, h2, h3 { margin: .3em 0; }
button {
  font-family: inherit; cursor: pointer;
  border: 2px solid var(--border); background: var(--bg-2); color: var(--text);
  border-radius: 8px; padding: 8px 14px; font-size: 14px;
  transition: transform .1s, background .15s, border-color .15s;
}
button:hover:not(:disabled) { background: var(--bg-3); border-color: var(--gold); transform: translateY(-1px); }
button:disabled { opacity: .4; cursor: not-allowed; }
button.primary { border-color: var(--gold); color: var(--gold); }
button.active { border-color: var(--blue-team); color: var(--blue-team); background: var(--bg-3); }
.hidden { display: none !important; }
.panel {
  background: var(--bg-1); border: 1px solid var(--border); border-radius: 14px;
  padding: 18px; width: 100%;
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
}
.bar { height: 9px; background: var(--bg-0); border-radius: 5px; overflow: hidden; border: 1px solid var(--border); }
.bar-fill { height: 100%; transition: width .3s ease; }
.bar-fill.hp { background: linear-gradient(90deg, #c0394a, #e0555e); }
.bar-fill.mp { background: linear-gradient(90deg, #2f6f9e, #4cc3ff); }
.bar-fill.ct { background: linear-gradient(90deg, #cf9d3f, #f0c674); }

/* ---------- TITLE ---------- */
#title-screen { text-align: center; margin-top: 8dvh; max-width: 480px; }
#title-screen .title { font-size: 40px; color: var(--gold); text-shadow: 0 0 16px rgba(240,198,116,.4); margin-bottom: 4px; }
#title-screen .subtitle { color: var(--text-dim); margin-bottom: 24px; }
#title-screen button { display: block; width: 100%; margin: 8px 0; padding: 12px; font-size: 16px; }

/* ---------- BARRACKS ---------- */
#barracks-screen { width: 100%; max-width: 1100px; }
.campaign-track { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 14px; }
.campaign-node {
  padding: 6px 10px; border-radius: 8px; border: 2px solid var(--border); font-size: 12px;
  background: var(--bg-2); color: var(--text-dim); white-space: nowrap;
}
.campaign-node.won { border-color: var(--green); color: var(--green); }
.campaign-node.next { border-color: var(--gold); color: var(--gold); animation: pulse-border 1.6s ease-in-out infinite; }
.recruits-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px; }
.recruit-card { padding: 12px; text-align: center; }
.recruit-portrait { width: 84px; height: 108px; margin: 0 auto 4px; filter: drop-shadow(0 3px 4px rgba(0,0,0,.5)); }
.recruit-card h3 { margin: 2px 0; font-size: 15px; }
.recruit-card .job-name { color: var(--gold); font-size: 12px; margin-bottom: 6px; }
.recruit-card select { width: 100%; margin-bottom: 8px; background: var(--bg-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px; font-size: 12px; }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; font-size: 11px; color: var(--text-dim); text-align: left; margin-bottom: 6px; }
.stat-row span b { color: var(--text); }
.jp-line { font-size: 12px; color: var(--gold); margin-bottom: 6px; }
.unlock-list { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.unlock-chip {
  font-size: 10px; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--bg-2); color: var(--text-dim); cursor: pointer;
}
.unlock-chip:hover:not(.locked) { border-color: var(--gold); color: var(--gold); }
.unlock-chip.locked { opacity: .45; cursor: not-allowed; }
.unlock-chip.unlocked { display: none; }
#deploy-btn { display: block; margin: 12px auto 0; font-size: 16px; padding: 12px 28px; }

/* ---------- BATTLE ---------- */
#battle-screen { width: 100%; max-width: 1200px; }
.battle-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.battle-top h2 { color: var(--gold); font-size: 16px; margin: 0; }
.battle-layout { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
.grid-wrap { background: var(--bg-1); border: 1px solid var(--border); border-radius: 12px; padding: 10px; }
#battle-grid { display: grid; position: relative; }
.tile {
  position: relative; border: 1px solid rgba(0,0,0,.25);
  display: flex; align-items: center; justify-content: center; cursor: default;
}
.tile.t-plain { background: linear-gradient(160deg, #3d6b3f, #2c4f2e); }
.tile.t-rough { background-image: radial-gradient(circle at 30% 30%, rgba(0,0,0,.25) 2px, transparent 3px), radial-gradient(circle at 65% 60%, rgba(0,0,0,.2) 2px, transparent 3px), linear-gradient(160deg, #2f4d2c, #223a20); }
.tile.t-water { background: linear-gradient(160deg, #2c5a78, #1a3a52); }
.tile.t-wall { background: linear-gradient(160deg, #5a5a62, #33333a); }
.tile.reachable { box-shadow: inset 0 0 0 999px rgba(76,195,255,.28); cursor: pointer; }
.tile.reachable:hover { box-shadow: inset 0 0 0 999px rgba(76,195,255,.45); }
.tile.hostile-range { box-shadow: inset 0 0 0 999px rgba(224,85,94,.3); cursor: pointer; }
.tile.hostile-range:hover { box-shadow: inset 0 0 0 999px rgba(224,85,94,.5); }
.tile.friendly-range { box-shadow: inset 0 0 0 999px rgba(126,201,143,.3); cursor: pointer; }
.tile.friendly-range:hover { box-shadow: inset 0 0 0 999px rgba(126,201,143,.5); }
.tile.aoe-preview { box-shadow: inset 0 0 0 999px rgba(240,198,116,.45); }
.tile.cur-actor { box-shadow: inset 0 0 0 3px var(--gold); }
.tile.cursor-tile { outline: 2px dashed var(--gold); outline-offset: -2px; }
.status-badges { position: absolute; top: 1px; left: 1px; display: flex; gap: 1px; z-index: 5; }
.status-badge { width: 11px; height: 11px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.8)); }
.unit-token { position: absolute; inset: 2px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; pointer-events: none; }
.unit-token .unit-svg { width: 78%; height: 78%; filter: drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
.unit-token.team-player .unit-svg { filter: drop-shadow(0 0 3px var(--blue-team)) drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
.unit-token.team-enemy .unit-svg { filter: drop-shadow(0 0 3px var(--red-team)) drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
.unit-token.ko { opacity: .25; }
.unit-token .mini-bars { width: 88%; margin-bottom: 1px; }
.unit-token .mini-bars .bar { height: 4px; margin-bottom: 1px; }
.unit-token.selected { outline: 2px solid var(--gold); outline-offset: -2px; border-radius: 4px; }
.float-num {
  position: absolute; left: 50%; top: 20%; transform: translateX(-50%);
  font-weight: bold; font-size: 15px; pointer-events: none; z-index: 20;
  text-shadow: 0 1px 3px #000, 0 0 6px #000; animation: float-up .9s ease-out forwards;
}
.float-num.dmg { color: #ff6b6b; } .float-num.crit { color: #ffd23d; font-size: 19px; }
.float-num.heal { color: #7ec98f; } .float-num.miss { color: #b8c4d0; }

.side-panel { display: flex; flex-direction: column; gap: 10px; width: 280px; }
.turn-queue { display: flex; flex-direction: column; gap: 4px; }
.tq-item { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 6px; font-size: 11px; background: var(--bg-2); }
.tq-item .tq-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
.tq-item.tq-player .tq-dot { background: var(--blue-team); } .tq-item.tq-enemy .tq-dot { background: var(--red-team); }
.selected-unit-info { display: flex; gap: 10px; align-items: center; }
.selected-unit-info .unit-svg { width: 56px; height: 72px; flex: 0 0 auto; }
.selected-unit-info .info-text { flex: 1; min-width: 0; }
.selected-unit-info h3 { font-size: 14px; margin: 0 0 2px; }
.selected-unit-info .job-tag { font-size: 11px; color: var(--gold); margin-bottom: 4px; }
.action-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
.action-buttons button { flex: 1; min-width: 70px; font-size: 12px; padding: 8px; }
.ability-list { display: flex; flex-direction: column; gap: 4px; }
.ability-btn { display: flex; align-items: center; gap: 8px; text-align: left; padding: 6px 8px; }
.ability-btn .ic { width: 22px; height: 22px; flex: 0 0 auto; }
.ability-btn .ab-text { flex: 1; }
.ability-btn .ab-name { font-size: 12px; font-weight: bold; }
.ability-btn .ab-meta { font-size: 10px; color: var(--text-dim); }
.battle-log { max-height: 110px; overflow-y: auto; font-size: 11px; color: var(--text-dim); background: var(--bg-2); border-radius: 8px; padding: 6px 8px; border: 1px solid var(--border); }
.battle-log div { margin: 1px 0; }

/* ---------- RESULT / CAMPAIGN VICTORY ---------- */
#result-screen .panel, #campaign-victory-screen .panel { max-width: 520px; margin: 8dvh auto 0; text-align: center; }
.result-title { font-size: 30px; margin-bottom: 8px; }
.result-title.win { color: var(--gold); } .result-title.lose { color: var(--red); }
.reward-list { text-align: left; font-size: 13px; margin: 12px 0; }
.reward-list div { padding: 3px 0; border-bottom: 1px solid var(--border); }

@keyframes float-up {
  0% { opacity: 0; transform: translate(-50%, 4px) scale(.7); }
  18% { opacity: 1; transform: translate(-50%, -6px) scale(1.05); }
  100% { opacity: 0; transform: translate(-50%, -34px) scale(1); }
}
@keyframes pulse-border { 0%,100% { box-shadow: 0 0 4px rgba(240,198,116,.4); } 50% { box-shadow: 0 0 12px rgba(240,198,116,.9); } }
@media (prefers-reduced-motion: reduce) { .float-num, .campaign-node.next { animation: none; } }

@media (max-width: 760px) {
  .battle-layout { flex-direction: column; align-items: stretch; }
  .side-panel { width: 100%; }
}
@media (max-width: 360px) {
  .panel { padding: 12px; }
  .recruit-portrait { width: 68px; height: 88px; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs id="global-svg-defs"></defs></svg>
<div id="app"></div>
<script src="game-data.js"></script>
<script src="sound.js"></script>
<script src="script.js"></script>
</body>
</html>
