<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>🕵️ Thief's Plotting Pad</title>
<style>
:root {
  --bg-0: #0c1210;
  --bg-1: #152420;
  --bg-2: #1d332c;
  --bg-3: #2a4a3f;
  --accent: #f0c674;
  --text: #e8f0ea;
  --text-dim: #9fc4ac;
  --border: #3d6656;
  --danger: #e0555e;
  --good: #7ec98f;

  /* The pad itself is plain paper with hand-drawn pink/magenta marks, matching the physical
     Thief Plotting Pad — distinct from the app's dark emoji-forward chrome around it. */
  --paper: #ece7d8;
  --paper-2: #e2dcc9;
  --grid-line: #b9b2a0;
  --wall: #26221a;
  --ink: #d1177d;
  --ink-dim: #b9a9c0;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg-0);
  color: var(--text);
  font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
  overscroll-behavior: none;
  touch-action: manipulation;
}
#app {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px;
  gap: 12px;
  max-width: 480px;
  margin: 0 auto;
}
h1, h2 { margin: 0; }
button {
  font-family: inherit;
  cursor: pointer;
  border: 2px solid var(--border);
  background: var(--bg-2);
  color: var(--text);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 14px;
}
button:hover:not(:disabled) { background: var(--bg-3); border-color: var(--accent); }
button:disabled { opacity: 0.4; cursor: default; }
button.primary { border-color: var(--accent); color: var(--accent); font-weight: bold; }
button.danger { border-color: var(--danger); color: var(--danger); }
button.success { border-color: var(--good); color: var(--good); }

.topbar {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
}
.topbar h1 { font-size: 1.1rem; color: var(--accent); }
.topbar .status { font-size: 0.85rem; color: var(--text-dim); }

main { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }

.step-label { color: var(--text-dim); font-size: 0.9rem; text-align: center; margin: 0; }

/* --- The pad: plain graph paper, like the physical Thief Plotting Pad --- */
.pad {
  width: 100%;
  max-width: 400px;
  background: var(--paper);
  border: 3px solid var(--wall);
  border-radius: 6px;
  padding: 8px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
}
.museum-grid {
  position: relative;
  display: grid;
  grid-template-columns: repeat(14, 1fr);
  grid-template-rows: repeat(13, 1fr);
  width: 100%;
  aspect-ratio: 14 / 13;
}
.cell {
  position: relative;
  border-radius: 0;
  padding: 0;
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(8px, 2.6vw, 14px);
  line-height: 1;
  background: var(--paper);
  color: var(--ink);
  font-weight: bold;
}
.cell.void { background: transparent; border: none !important; pointer-events: none; }
.cell.dim { background: var(--paper-2); color: var(--ink-dim); }
.cell:hover:not(:disabled) { background: var(--paper-2) !important; }
.cell.visited:hover:not(:disabled) { background: #ddd0da !important; }
.cell.drafted:hover:not(:disabled) { background: #e6b8d6 !important; }

/* A door/window: a small non-travelable square marker sitting outside the room it serves, not a
   floor tile — so it always stays visually distinct from playable cells regardless of step. */
.cell.window {
  background: transparent !important;
  pointer-events: auto;
}
.cell.window::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  width: 46%;
  height: 46%;
  transform: translate(-50%, -50%);
  border: 1.5px solid var(--wall);
  opacity: 0.6;
  pointer-events: none;
}
.cell.window:hover:not(:disabled)::after { opacity: 0.9; }
.cell.window.mark-entrance::after { border-color: var(--ink); border-width: 2px; opacity: 1; }
.cell.mark-entrance { color: var(--ink); font-size: clamp(9px, 3vw, 15px); }
.cell.visited { background: #ddd0da; }
.cell.drafted { background: #e6b8d6; }
.cell.current { box-shadow: inset 0 0 0 2px var(--ink); }

.cam-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 78%;
  height: 78%;
  border-radius: 50%;
  border: 1.5px solid var(--ink);
  position: relative;
  font-size: 0.9em;
}
.cam-badge.cam-off { opacity: 0.5; }
.cam-badge.cam-off::after {
  content: "";
  position: absolute;
  left: -10%;
  right: -10%;
  top: 50%;
  border-top: 1.5px solid var(--ink);
  transform: rotate(45deg);
}
.circle-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 82%;
  height: 82%;
  border-radius: 50%;
  border: 1.5px solid var(--ink);
}

.trail-overlay { position: absolute; top: 0; left: 0; pointer-events: none; }
/* Each move segment is drawn as its own stroke (not one combined path), and at low opacity, so
   where the Thief's path loops back over itself the overlapping strokes visibly darken. */
.trail-line { fill: none; stroke: var(--ink); stroke-width: 2; opacity: 0.45; }
.trail-dot { fill: var(--ink); opacity: 0.9; }

/* --- Pad legend strip: M M + pliers, camera 1-6 --- */
.pad-legend {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1.5px solid var(--grid-line);
  flex-wrap: wrap;
  gap: 8px;
}
.legend-group { display: flex; align-items: center; gap: 4px; }
.legend-m, .legend-cam {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--ink);
  font-weight: bold;
  font-size: 0.85rem;
  position: relative;
  width: 22px;
  height: 22px;
  padding: 0;
}
button.legend-m {
  background: transparent;
  border: 1.5px solid var(--ink);
  border-radius: 4px;
  cursor: pointer;
}
button.legend-m:hover:not(:disabled) { background: rgba(209, 23, 125, 0.12); }
.legend-cam { border: 1.5px solid var(--ink); border-radius: 50%; }
.legend-m.off, .legend-cam.off { opacity: 0.45; }
.legend-m.off { cursor: default; }
.legend-m.off::after, .legend-cam.off::after {
  content: "";
  position: absolute;
  left: -15%;
  right: -15%;
  top: 50%;
  border-top: 1.5px solid var(--ink);
  transform: rotate(-45deg);
}
.legend-tool { font-size: 0.9rem; }

/* --- Setup screen --- */
.setup-screen { align-items: center; }
.review-list { list-style: none; padding: 0; margin: 4px 0; text-align: center; color: var(--text-dim); }
.review-list li { padding: 2px 0; }
.nav-row { display: flex; gap: 10px; }

/* --- Play screen --- */
.play-screen { align-items: stretch; }
.panel {
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.counters { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-dim); flex-wrap: wrap; gap: 6px; }
.move-controls { display: flex; flex-direction: column; gap: 6px; }
.move-controls .hint { margin: 0; font-size: 0.82rem; color: var(--text-dim); }
.move-controls > div, .move-controls button { display: inline-block; }
.context-actions, .always-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.escape-picker { display: flex; flex-direction: column; gap: 6px; background: var(--bg-2); border-radius: 8px; padding: 10px; }
.escape-picker.hidden { display: none; }
.log { max-height: 220px; overflow-y: auto; background: var(--bg-0); border-radius: 8px; padding: 8px 10px; }
.log h2 { font-size: 0.85rem; color: var(--text-dim); margin: 0 0 4px; }
.log ol { margin: 0; padding-left: 18px; font-size: 0.8rem; color: var(--text-dim); }

/* --- Summary screen --- */
.summary-screen { align-items: center; text-align: center; gap: 14px; }
.summary-screen h2.success { color: var(--good); }
.summary-screen h2.danger { color: var(--danger); }

@media (max-width: 360px) {
  .panel { padding: 8px; }
  button { padding: 7px 9px; font-size: 13px; }
}
</style>
</head>
<body>
<div id="app"></div>
<script src="game-data.js"></script>
<script src="script.js"></script>
</body>
</html>
